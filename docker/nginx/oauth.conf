server {
    listen 8081;
    server_name _;
    access_log off;
    server_tokens off;
    # Resolve the private PHP service at request time. Docker may reassign its
    # IP when the app is recreated without restarting the long-lived proxy.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $mcp_php_backend app:9000;
    # Browser-only OAuth endpoints. No location ever forwards requests to mcp.php.
    location ~ ^/(?:\.well-known/oauth-authorization-server/[a-z0-9-]+|[a-z0-9-]+/(?:authorize|login|token|approve))$ {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/oauth.php;
        fastcgi_pass $mcp_php_backend;
        client_max_body_size 8k;
    }
    location / { return 404; }
}
