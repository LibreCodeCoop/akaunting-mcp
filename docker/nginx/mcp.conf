server {
    listen 8080;
    server_name _;
    access_log off;
    server_tokens off;
    # Resolve the private PHP service at request time. Docker may reassign its
    # IP when the app is recreated without restarting the long-lived proxy.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $mcp_php_backend app:9000;
    location = /mcp {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/mcp.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass $mcp_php_backend;
        client_max_body_size 512k;
    }
    location = /.well-known/oauth-protected-resource/mcp {
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/mcp.php;
        fastcgi_pass $mcp_php_backend;
    }
    location / { return 404; }
}
