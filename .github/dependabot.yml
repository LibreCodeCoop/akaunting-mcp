version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development-tools:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: /vendor-bin/phpunit
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: /vendor-bin/phpstan
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: composer
    directory: /vendor-bin/php-cs-fixer
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      runtime-image:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-actions:
        patterns: ["*"]
