name: Akaunting API parity
on:
  push:
  pull_request:
  schedule:
    - cron: '19 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: api-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nfse-contract:
    # Temporary integration gate for companion NFS-e PR #600. Before merging
    # this MCP PR, switch back to main after #600 has been integrated.
    name: NFS-e route coverage against companion PR #600
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: LibreCodeCoop/akaunting-nfse
          # Audit the exact signed companion PR #600 revision. Replace this
          # temporary SHA with main only after module integration.
          ref: 1f083480ebba1731b90f0af5ff4e7bf21cd00f6f
          path: nfse-module
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: none
      - name: Detect new, changed or stale NFS-e API contracts
        run: >-
          php bin/check-api-parity.php
          --module-source=nfse-module/Routes/api.php
          --baseline=docs/contracts/pending-api-routes.json
