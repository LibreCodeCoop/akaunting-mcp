name: PHPUnit
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit PHP 8.5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.5'
          extensions: curl, sodium, mbstring, xml, dom
          tools: composer:v2
          coverage: pcov
      - name: Install locked development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Install isolated phpunit toolchain
        run: composer bin phpunit install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Exercise business behaviors and collect source coverage
        run: |
          php -d pcov.enabled=1 vendor-bin/phpunit/vendor/bin/phpunit             -c phpunit.xml.dist --no-progress --coverage-filter src             --coverage-clover "$RUNNER_TEMP/akaunting-coverage.xml"
          php tools/check-coverage.php "$RUNNER_TEMP/akaunting-coverage.xml" 77
